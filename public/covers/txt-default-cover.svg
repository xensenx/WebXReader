<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="txtCoverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="45%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="txtSpineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.18)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.04)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </linearGradient>
    <linearGradient id="txtInnerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>

  <!-- Blueish Background with Subtle Book Texture -->
  <rect width="300" height="450" fill="url(#txtCoverBg)" rx="4" />

  <!-- Subtle Top Lighting -->
  <rect width="300" height="120" fill="url(#txtInnerGlow)" opacity="0.5" rx="4" />

  <!-- Subtle Spine Depth on Left Edge -->
  <rect width="14" height="450" fill="url(#txtSpineShadow)" rx="4" />

  <!-- Subtle Inner Border -->
  <rect x="0.5" y="0.5" width="299" height="449" fill="none" stroke="rgba(255, 255, 255, 0.5)" stroke-width="1" rx="4" />

