name: Deploy Firebase Hosting mirror

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: xensenx
          workload_identity_provider: projects/1000429566837/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: firebase-hosting-deployer@xensenx.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy existing Firebase Hosting site
        run: firebase deploy --only hosting:webxreader --project xensenx --non-interactive
